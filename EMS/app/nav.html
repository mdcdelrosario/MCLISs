<script>
    function loadSubstation(name) {
        sessionStorage.setItem('currentSubstation', name);
        $('#main').load('app/substation/substation.html?v=' + new Date().getTime());
    }

    function loadReport(name) {
        if (name === 'daily')
            $('#main').load('app/reports/daily.html?v=' + new Date().getTime());
        else if (name === 'monthly')
            $('#main').load('app/reports/monthly.html?v=' + new Date().getTime());
    }

</script>
