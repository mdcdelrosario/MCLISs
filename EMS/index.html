<!DOCTYPE html>
<html>

<head>
    <title>EMS (PANELCO III) </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <META HTTP-EQUIV="CACHE-CONTROL" CONTENT="NO-CACHE">
    <link rel="stylesheet" href="css/w3.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/global.css">


    <script src="js/common/jquery.min.js"></script>
    <script src="js/common/vue.min.js"></script>
    <script src="js/common/charts.min.js"></script>
    <script src="js/common/charts2.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/feeder-card.js"></script>
    <script src="js/feeder-graph.js"></script>

</head>

<script>
    function updateDateTime() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const date = now.toLocaleDateString(undefined, options);
        const time = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
        $('#currentDateTime').text(`${date} ${time}`);
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);
</script>

<body>
    <div class="w3-card-4 w3-border"
        style="position: fixed; top: 0; width: 100%; z-index: 1000; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 15px;  background-color: #222;">

        <!-- Left Side: Logo + System Title -->
        <div style="display: flex; align-items: center;">
            <div id="logoClick" class="w3-circle w3-dark-grey w3-center"
                style="width: 50px; height: 50px; overflow: hidden; margin-right: 15px; cursor: pointer;">
                <img src="assets/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div style="font-weight: bold; white-space: nowrap;">
                ENEGY MANAGEMENT SYSTEM (EMS) | PANELCO III ELECTRIC COOPERATIVE (PANELCO III)
            </div>
        </div>

        <!-- Right Side: User Name and Date -->
        <div style="text-align: right; font-size: 14px;">
            <div id="currentDateTime"></div>
        </div>
    </div>



    <!-- Navigation will be displayed here-->
    <div id="sidebar" class="w3-sidebar w3-bar-block w3-light-grey w3-card" style="width:300px;">


    </div>

    <!-- Program Modules will be displayed here-->
    <div id="main" class="w3-container" style="margin-left:300px; padding-top:70px;">
    </div>

    <!-- THIS IS THE MESSAGE BOX DIV -->
    <div id="div_msgbox" class="msgboxdiv">
    </div>
    <div id="div_loader" class="msgboxdiv">
    </div>

</body>

<script>
    $('#sidebar').load('app/nav.html');
    //$('#main').load('app/reports/daily.html');
    $('#main').load('app/dashboard.html');

    // Logo Click Hide Sidebar and Adjust Main Content
    $(document).ready(function () {
        let sidebarVisible = true; // track state

        $('#logoClick').click(function () {
            if (sidebarVisible) {
                // Hide sidebar, Expand main
                $('#sidebar').hide();
                $('#main').css('margin-left', '0');
            } else {
                // Show sidebar, Restore main
                $('#sidebar').show();
                $('#main').css('margin-left', '300px');
            }
            sidebarVisible = !sidebarVisible; // Flip state
        });
    });
</script>

</html>
