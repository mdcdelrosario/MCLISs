<!DOCTYPE html>
<html>
    <head>
        <title>ISELCO I - METER READING, BILLING AND COLLECTION SYSTEM</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <META HTTP-EQUIV="CACHE-CONTROL" CONTENT="NO-CACHE">
        <link rel="stylesheet" href="css/w3.css">
        <link rel="stylesheet" href="css/font-awesome-4.7.0/css/font-awesome.css">

        <style>
            .logincont {
                box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
                transition: 0.3s;
                width: 40%;
                background-color: #fefefe;
                border: 1px solid #888;
                padding: 16px !important;
                padding-top: 0px !important;
                position: fixed !important;
                max-width: 500px !important;
                max-height: fit-content !important;
                margin: 4% auto !important;
                left: 0 !important;
                right: 0 !important;
            }

            .divloginbottom {
                display: flex;
                flex-direction: row;
                margin-top: 20px;
            }

            .txtError {
                text-align: center;
                background-color: #e53935;
                font-weight: 500;
                padding: 4px 0;
                color: white;
            }

            .txtLoginHeader {
                text-align: center;
            }

            .txtInp {
                width: 100%;
                padding: 12px 20px;
                margin: 8px 0;
                display: inline-block;
                border: 1px solid #ccc;
                box-sizing: border-box;
            }

            .btnLogin {
                background-color: #4CAF50;
                color: white;
                padding: 12px 20px;
                margin: 8px 0;
                border: none;
                cursor: pointer;
                width: 100%;
                font-size: 24px;
            }

            .btnLogin:hover,
            .cancelbtn:hover {
                opacity: 0.8;
            }

            .imgcontainer {
                text-align: center;
            }

            .imgLogo {
                width: 20%;
                border-radius: 50%;
            }

            .container {
                padding: 6px;
            }

            .spnForgot {
                float: right;
                width: 100%;
                text-align: right;
            }

            .divPass {
                display: flex;
                flex-direction: row;
            }

            .divPass span {
                position: absolute;
                right: 40px;
                bottom: 158px;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            .divPass input {
                padding-right: 52px;
            }

            .fa {
                font-size: 26px;
            }

            .eye-icon {
                cursor: pointer;
            }
        </style>
    </head>

    <body style="background-color: #212121">
        <div id="app2" class="logincont">
            <h2 class="txtLoginHeader">LOGIN FOR ISELCO I</h2>
            <form @submit.prevent="login">
                <div class="imgcontainer">
                    <img src="assets/logo.png" alt="Avatar" class="imgLogo">
                </div>

                <div class="container">
                    <label for="uname"><b>Username</b></label>
                    <input 
                        type="text" 
                        class="txtInp" 
                        v-model="username" 
                        placeholder="Username" 
                        required>
                    
                    <label for="psw"><b>Password</b></label>
                    <div class="divPass">
                        <input 
                            type="password" 
                            class="txtInp" 
                            v-model="password" 
                            id="password" 
                            placeholder="Password" 
                            required /> 
                        <span class="eye-icon" id="eyeIcon" @click="togglePassword"> 
                            <i class="fa" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i> 
                        </span>
                    </div>
                    
                    <div class="txtError" v-if="errorMessage">
                        {{ errorMessage }}
                    </div>
                    
                    <button type="submit" class="btnLogin">Login</button>
                </div>
            </form>
        </div>

        <script src="js/fjs.js"></script>
        <script src="js/config.js"></script>
        <script src="js/vue.min.js"></script>
        <script>
            new Vue({
                el: '#app2',
                data: {
                    username: '',
                    password: '',
                    showPassword: false,
                    errorMessage: '',
                },
                methods: {
                    togglePassword() {
                        this.showPassword = !this.showPassword;
                        const passwordField = document.getElementById('password');
                        passwordField.type = this.showPassword ? 'text' : 'password';
                    },
                    login() {
                        // Call Laravel API to validate login
                        fetch(API_URL + 'login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json',
                            },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password,
                            }),
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Invalid credentials');
                            }
                            return response.json();
                        })
                        .then(data => {
                            // Handle successful login
                            if (data.status === 'success') {
                                // Now send the username and token to save them in the session
                                fetch('save_session.php', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Accept': 'application/json',
                                    },
                                    body: JSON.stringify({
                                        username: data.username,
                                        token: data.token,  // The token received from login API
                                    })
                                })
                                .then(response => response.json())
                                .then(saveData => {
                                    if (saveData.status === 'success') {
                                        console.log('Session data saved: ', saveData);
                                        // After saving session data, redirect to index.php
                                        window.location.href = 'index.php';
                                    } else {
                                        console.error('Failed to save session data: ', saveData.message);
                                    }
                                })
                                .catch(error => {
                                    console.error('Error saving session: ', error);
                                });
                            } else {
                                this.errorMessage = data.message;
                            }
                        })
                        .catch(error => {
                            // Handle login error
                            this.errorMessage = error.message;
                        });
                    }
                },
            });
        </script>
    </body>
</html>
